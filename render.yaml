services:
  - type: web
    name: brandguard-ai
    env: python
    plan: free
    region: oregon
    buildCommand: |
      npm install --prefix frontend
      npm run build --prefix frontend
      pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
